<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            background: #2C2C2C; color: #ffffff;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        *, *:before, *:after { box-sizing: inherit; }
        *:focus { outline: none; }
        * { user-select: none; -webkit-user-select: none; }

        .figma-menu {
            display: flex; flex-direction: column; align-items: flex-start;
            padding: 8px; position: absolute; width: 157px;
            background: #1E1E1E;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.35), 0px 10px 16px rgba(0,0,0,0.35),
                        inset 0px 0px 0.5px rgba(255,255,255,0.35), inset 0px 0.5px 0px rgba(255,255,255,0.08);
            border-radius: 13px; z-index: 1000;
        }
        .menu-item {
            display: flex; flex-direction: row; align-items: center;
            padding: 4px 12px; width: 141px; height: 24px;
            cursor: pointer; color: #ffffff; font-size: 11px;
            font-weight: 500; border-radius: 5px; transition: background 0.1s;
        }
        .menu-item:hover { background: #0C8CE9; }

        .select-wrapper {
            display: flex; flex-direction: row; align-items: center;
            gap: 1px; width: 100%; height: 24px;
        }
        .select-left-frame {
            display: flex; flex-direction: column; align-items: flex-start;
            justify-content: center; padding: 0 8px; flex-grow: 1;
            height: 24px; background: #383838; border-radius: 5px 0 0 5px; cursor: pointer;
        }
        .select-right-frame {
            display: flex; align-items: center; justify-content: center;
            width: 24px; height: 24px; background: #383838;
            border-radius: 0 5px 5px 0; cursor: pointer;
        }
        .select-text {
            font-size: 11px; font-weight: 500; line-height: 13px;
            letter-spacing: 0.055px; color: #FFF;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .input-container-single {
            display: flex; align-items: center;
            padding: 0 8px; width: 100%; height: 24px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 5px;
            background: transparent; margin-top: 8px; transition: border-color 0.1s;
        }
        .input-container-single:focus-within { border-color: #0C8CE9; }
        .input-field {
            background: transparent; border: none; outline: none;
            width: 100%; height: 13px;
            font-family: inherit; font-size: 11px; font-weight: 500;
            line-height: 13px; letter-spacing: 0.055px; color: #FFF;
        }
        .input-field::placeholder { color: rgba(255,255,255,0.4); }

        .btn-base {
            height: 32px; border-radius: 5px; font-weight: 500; font-size: 11px;
            width: 100%; transition: all 0.1s ease;
            display: flex; align-items: center; justify-content: center;
            padding: 0 12px; border: none; cursor: pointer;
            font-family: inherit; letter-spacing: 0.055px;
        }
        .btn-idle { background: #383838; color: rgba(255,255,255,0.4); cursor: default; }
        .btn-active { background: #0C8CE9; color: #FFF; }
        .btn-done { background: #394360; color: #7CC4F8; }
        .btn-error { background: #E03E1A; color: #FFF; }

        .frame-header {
            height: 56px; border-bottom: 1px solid #444;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; flex-shrink: 0; width: 100%;
        }
        .frame-provider { border-bottom: 1px solid #444; padding: 0 16px 16px; flex-shrink: 0; width: 100%; }
        .frame-provider.expanded { height: 120px; }
        .frame-provider.compact  { height: 88px; }
        .frame-normal { height: 88px; border-bottom: 1px solid #444; padding: 0 16px 16px; flex-shrink: 0; width: 100%; }
        .frame-footer {
            flex-grow: 1; padding: 16px;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center; width: 100%;
        }
        .label-text { height: 48px; display: flex; align-items: center; font-weight: 600; font-size: 11px; color: #FFF; }
        .status-box {
            border: 1px solid rgba(255,255,255,0.1); border-radius: 5px;
            height: 24px; width: 100%; padding: 0 8px;
            display: flex; align-items: center; font-size: 11px; color: rgba(255,255,255,0.4);
        }
        .tg-btn {
            width: 24px; height: 24px; background: #383838; border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.1s;
        }
        .tg-btn:hover { background: #0C8CE9; }
        .powered-text {
            font-size: 8px; font-weight: 500; text-transform: uppercase;
            color: rgba(255,255,255,0.1); letter-spacing: 0.055px; text-align: center;
        }
        .overlay { position: fixed; inset: 0; z-index: 40; }

        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app" style="display:flex;flex-direction:column;width:100%;height:100%;background:#2C2C2C;position:relative;"></div>

<script>
const LANGUAGES = [
    { code: 'ru', name: 'Russian' }, { code: 'en', name: 'English' },
    { code: 'de', name: 'German' }, { code: 'pl', name: 'Polish' },
    { code: 'ar', name: 'Arabic' }, { code: 'zh', name: 'Chinese' }
];
const PROVIDERS = [
    { id: 'google-free', name: 'Google translator' },
    { id: 'gemini-cloud', name: 'Gemini API Key' },
    { id: 'lm-studio', name: 'Local LLM Server' }
];

// ---- SVGs ----

// ---- State ----
let state = {
    count: 0,
    target: 'ru',
    status: 'idle', // idle | loading | success | error
    provider: 'google-free',
    apiKey: '',
    localUrl: 'http://localhost:1234/v1',
    activeDropdown: null
};

function setState(patch) {
    Object.assign(state, patch);
    render();
}

// ---- Helpers ----
function el(tag, attrs, ...children) {
    const e = document.createElement(tag);
    if (attrs) {
        Object.entries(attrs).forEach(([k, v]) => {
            if (k === 'class') e.className = v;
            else if (k === 'style') Object.assign(e.style, v);
            else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
            else e.setAttribute(k, v);
        });
    }
    children.forEach(c => {
        if (c == null) return;
        if (typeof c === 'string') e.appendChild(document.createTextNode(c));
        else e.appendChild(c);
    });
    return e;
}

function html(parent, htmlStr) {
    const d = document.createElement('div');
    d.innerHTML = htmlStr;
    while (d.firstChild) parent.appendChild(d.firstChild);
}

// ---- Components ----
function buildHeader() {
    const wrap = el('div', { class: 'frame-header' });

    const left = el('div', { style: { display:'flex', alignItems:'center', gap:'12px' } });
    const logo = el('div');
    logo.innerHTML = LOGO_SVG;
    const name = el('span', { style: { fontSize:'11px', fontWeight:'500', color:'rgba(255,255,255,0.7)', overflow:'hidden', whiteSpace:'nowrap', width:'120px', textOverflow:'ellipsis' } }, 'Andrushkevich Stepan');
    left.append(logo, name);

    const tgBtn = el('div', { class: 'tg-btn', onClick: () => window.open('https://t.me/necrondesign', '_blank') });
    tgBtn.innerHTML = TG_SVG;

    wrap.append(left, tgBtn);
    return wrap;
}

function buildSelect(options, value, onChange, dropdownId, positionAbove) {
    const container = el('div', { style: { position:'relative', width:'100%' } });

    const selectedLabel = options.find(o => (o.id || o.code) === value)?.name || '';

    const wrapper = el('div', { class: 'select-wrapper', onClick: (e) => {
        e.stopPropagation();
        setState({ activeDropdown: state.activeDropdown === dropdownId ? null : dropdownId });
    }});

    const leftFrame = el('div', { class: 'select-left-frame' });
    const textSpan = el('span', { class: 'select-text' }, selectedLabel);
    leftFrame.appendChild(textSpan);

    const rightFrame = el('div', { class: 'select-right-frame' });
    rightFrame.innerHTML = CHEVRON_SVG;

    wrapper.append(leftFrame, rightFrame);
    container.appendChild(wrapper);

    if (state.activeDropdown === dropdownId) {
        const menu = el('div', { class: 'figma-menu', style: { top: '-8px', right: '0' } });
        options.forEach(opt => {
            const key = opt.id || opt.code;
            const item = el('div', { class: 'menu-item', onClick: (e) => {
                e.stopPropagation();
                onChange(key);
                setState({ activeDropdown: null });
            }});
            const checkWrap = el('div', { style: { width:'16px', marginRight:'4px', color:'white', display:'flex', alignItems:'center' } });
            if (key === value) checkWrap.innerHTML = CHECK_SVG;
            item.append(checkWrap, document.createTextNode(opt.name));
            menu.appendChild(item);
        });
        container.appendChild(menu);
    }

    return container;
}

function buildProviderFrame() {
    const isExpanded = state.provider !== 'google-free';
    const frame = el('div', { class: 'frame-provider ' + (isExpanded ? 'expanded' : 'compact') });
    const label = el('div', { class: 'label-text' }, 'Translation provider');
    frame.appendChild(label);

    const inner = el('div', { style: { display:'flex', flexDirection:'column' } });

    inner.appendChild(buildSelect(
        PROVIDERS, state.provider,
        (val) => setState({ provider: val, status: 'idle' }),
        'provider'
    ));

    if (isExpanded) {
        const inputWrap = el('div', { class: 'input-container-single' });
        const input = el('input', {
            class: 'input-field',
            type: state.provider === 'gemini-cloud' ? 'password' : 'text',
            placeholder: state.provider === 'gemini-cloud' ? 'Paste key here' : 'http://localhost:1234/v1',
            value: state.provider === 'gemini-cloud' ? state.apiKey : state.localUrl,
            onInput: (e) => {
                if (state.provider === 'gemini-cloud') state.apiKey = e.target.value;
                else state.localUrl = e.target.value;
            }
        });
        inputWrap.appendChild(input);
        inner.appendChild(inputWrap);
    }

    frame.appendChild(inner);
    return frame;
}

function buildTranslateToFrame() {
    const frame = el('div', { class: 'frame-normal', style: { position:'relative', zIndex:'40' } });
    const label = el('div', { class: 'label-text' }, 'Translation to');
    frame.appendChild(label);
    frame.appendChild(buildSelect(
        LANGUAGES, state.target,
        (val) => setState({ target: val, status: 'idle' }),
        'language'
    ));
    return frame;
}

function buildSelectionFrame() {
    const frame = el('div', { class: 'frame-normal', style: { position:'relative', zIndex:'10' } });
    const label = el('div', { class: 'label-text' }, 'Selection');
    const box = el('div', { class: 'status-box' });
    const span = el('span', {
        style: { color: state.count > 0 ? '#fff' : 'rgba(255,255,255,0.4)' }
    }, state.count > 0 ? state.count + ' layers selected' : 'No selection');
    box.appendChild(span);
    frame.append(label, box);
    return frame;
}

function buildFooter() {
    const frame = el('div', { class: 'frame-footer', style: { position:'relative', zIndex:'10' } });
    const inner = el('div', { style: { width:'100%', display:'flex', flexDirection:'column', gap:'8px' } });

    const s = state.status;
    const isDisabled = s === 'loading' || state.count === 0;
    let btnClass = 'btn-base ';
    if (s === 'loading') btnClass += 'btn-idle';
    else if (s === 'success') btnClass += 'btn-done';
    else if (s === 'error') btnClass += 'btn-error';
    else btnClass += (state.count > 0 ? 'btn-active' : 'btn-idle');

    const btn = el('button', {
        class: btnClass,
        disabled: isDisabled,
        onClick: isDisabled ? null : run
    });

    if (s === 'loading') {
        btn.innerHTML = LOADER_SVG + '<span style="padding:0 4px">Processing...</span>';
    } else if (s === 'success') {
        btn.innerHTML = '<span style="width:16px;height:16px;color:#7CC4F8;display:flex;align-items:center">' + CHECK_SVG + '</span>' +
            '<span style="padding:0 4px;font-weight:500;font-size:11px;color:#7CC4F8">Done</span>';
    } else if (s === 'error') {
        btn.textContent = 'Error';
    } else {
        btn.textContent = 'Translate selection';
    }

    const poweredText = state.provider === 'lm-studio' ? 'POWERED BY LOCAL LLM'
        : state.provider === 'gemini-cloud' ? 'POWERED BY GEMINI API'
        : 'POWERED BY GOOGLE TRANSLATE';

    const powered = el('div', { style: { height:'32px', display:'flex', alignItems:'center', justifyContent:'center' } });
    powered.appendChild(el('span', { class: 'powered-text' }, poweredText));

    inner.append(btn, powered);
    frame.appendChild(inner);
    return frame;
}

function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';

    if (state.activeDropdown) {
        const overlay = el('div', { class: 'overlay', onClick: () => setState({ activeDropdown: null }) });
        app.appendChild(overlay);
    }

    app.appendChild(buildHeader());
    app.appendChild(buildProviderFrame());
    app.appendChild(buildTranslateToFrame());
    app.appendChild(buildSelectionFrame());
    app.appendChild(buildFooter());
}

// ---- Translation ----
async function translateAll(msg) {
    const { payload, target, provider, apiKey, localUrl } = msg;
    setState({ status: 'loading' });
    try {
        const targetLangName = LANGUAGES.find(l => l.code === target)?.name;
        let results = [];

        if (provider === 'google-free') {
            for (const item of payload) {
                const res = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + target + '&dt=t&q=' + encodeURIComponent(item.text));
                const data = await res.json();
                results.push({ id: item.id, translatedText: data[0].map(p => p[0]).join('') });
            }
        } else {
            let cleanUrl = localUrl.replace('127.0.0.1', 'localhost').trim().replace(/\/$/, '');
            if (provider === 'lm-studio' && !cleanUrl.endsWith('/v1')) cleanUrl += '/v1';

            const endpoint = provider === 'lm-studio'
                ? cleanUrl + '/chat/completions'
                : 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions?key=' + apiKey;

            const requestBody = {
                model: provider === 'lm-studio' ? 'local-model' : 'gemini-1.5-flash',
                messages: [
                    {
                        role: 'system',
                        content: 'Translate to ' + targetLangName + '. IMPORTANT RULES: 1. Do NOT translate brand names, proper nouns, or technical terms (e.g., "API", "Gemini", "UI", "UX", "Apple"). Leave them strictly in their original language. 2. Strictly output valid JSON only: {"results": [{"id": "...", "translatedText": "..."}]}'
                    },
                    { role: 'user', content: JSON.stringify(payload) }
                ],
                temperature: 0.1,
                stream: false
            };

            if (provider === 'gemini-cloud') {
                requestBody.response_format = { type: 'json_object' };
            }

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!res.ok) {
                const errTxt = await res.text();
                throw new Error('HTTP Error: ' + res.status + ' - ' + errTxt);
            }

            const data = await res.json();

            if (!data || !data.choices || data.choices.length === 0) {
                throw new Error('Invalid response format from API.');
            }

            let answer = data.choices[0].message.content;
            answer = answer.replace(/```json/gi, '').replace(/```/g, '').trim();
            results = JSON.parse(answer).results;
        }

        parent.postMessage({ pluginMessage: { type: 'apply-data', results } }, '*');
    } catch (e) {
        console.error('Translation error:', e);
        setState({ status: 'error' });
    }
}

function run() {
    parent.postMessage({ pluginMessage: { type: 'save-settings', apiKey: state.apiKey, localUrl: state.localUrl, provider: state.provider } }, '*');
    parent.postMessage({ pluginMessage: { type: 'run-translation', target: state.target, apiKey: state.apiKey, localUrl: state.localUrl, provider: state.provider } }, '*');
}

// ---- Messages from plugin ----
window.onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'settings-loaded') {
        setState({
            apiKey: msg.apiKey || '',
            localUrl: (msg.localUrl || 'http://localhost:1234/v1').replace('127.0.0.1', 'localhost'),
            provider: msg.provider || 'google-free'
        });
    }
    if (msg.type === 'selection-change') {
        setState({ count: msg.count, status: 'idle' });
    }
    if (msg.type === 'start-api-call') {
        translateAll(msg);
    }
    if (msg.type === 'apply-data-success') {
        setState({ status: 'success' });
    }
    if (msg.type === 'error') {
        setState({ status: 'error' });
    }
};

// ---- Init ----
render();
</script>
</body>
</html>
